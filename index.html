<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eeede8" />
    <title>서아 · JST 캐릭터 스튜디오</title>
  </head>
  <body>
    <header><a class="brand" href="/">JST <span>캐릭터 스튜디오</span></a><span id="status" role="status">준비 중</span></header>
    <main>
      <aside>
        <div class="intro"><p class="eyebrow">CHARACTER 01</p><h1>서아</h1><p>한국인 · 25세 · 가상 캐릭터</p></div>
        <a id="source-link" target="_blank" rel="noopener"><img id="source-image" alt="아이보리 상의와 회색 바지를 입은 여성 캐릭터 서아의 정면 전신 원본" /></a>
        <div class="source-caption"><span>생성 원본</span><span>1024 × 1536</span></div>
        <div class="downloads"><a id="download-model" hidden download>3D 캐릭터 저장 ↗</a></div>
        <p class="aside-note">이미지 한 장에서 움직이는 캐릭터로.<br />PINOC · JST-2</p>
      </aside>
      <section class="stage" aria-label="3D 캐릭터 미리보기">
        <canvas id="canvas" aria-label="드래그로 캐릭터 회전, 스크롤로 확대 및 축소" tabindex="0"></canvas>
        <div id="notice" class="notice"><span class="notice-mark">3D</span><h2 id="notice-title">캐릭터를 준비하고 있습니다</h2><p id="notice-body">생성된 모델을 불러오면 여기에서 움직임을 확인할 수 있습니다.</p><button id="retry" hidden>다시 불러오기</button></div>
        <div class="stage-top"><span id="view-label">3D 미리보기</span><button id="reset" disabled>시점 초기화 ↺</button></div>
        <div class="transport">
          <div id="motions" class="motions" aria-label="캐릭터 동작"></div>
          <div class="playback"><button id="pause" disabled>일시정지</button><label>속도 <select id="speed" disabled><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label></div>
        </div>
        <p class="hint">드래그로 회전 · 스크롤로 확대</p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
